aid: commons-clinic
name: Commons Clinic
description: 'Commons Clinic is a Santa Monica, California physician-led specialty care
  group founded in 2021 that operates multi-specialty musculoskeletal clinics across
  Southern California — Santa Monica, Marina del Rey, Beverly Hills, Torrance, Westlake
  Village, Lakewood and two Long Beach sites — plus its own ambulatory surgery center,
  the Marina Orthopedic & Spine Institute. The group treats orthopedic, spine, sports
  medicine, joint replacement and chronic pain conditions with on-site imaging, physical
  and occupational therapy, injections and surgery under one roof, and has extended into
  a bundled preventive diagnostics program marketed as Wholebody. It is venture-backed
  and its stock trades on private secondary markets. Commons Clinic is a care delivery
  organization, not an API provider: it publishes no developer program, no API documentation,
  and no machine-readable API contract. The only machine-readable artifacts on its host are
  a Rank Math generated llms.txt and the stock WordPress core REST API behind its marketing
  site.'
